networks:
  companion-net:
    driver: bridge

volumes:
  neo4j_data:
  mongo_data:

services:
  # ── Frontend Shell ─────────────────────────
  shell:
    build:
      context: .
      dockerfile: ./apps/shell/Dockerfile
    ports:
      - "3000:3000"
    networks:
      - companion-net
    env_file: .env
    depends_on:
      - api-gateway

  # ── Auth Frontend ──────────────────────────
  mfe-auth:
    build:
      context: .
      dockerfile: ./apps/mfe-auth/Dockerfile
    ports:
      - "3001:3001"
    networks:
      - companion-net
    env_file: .env

  # ── API Gateway ────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: ./backend/services/nodejs/api-gateway/Dockerfile
    ports:
      - "4000:4000"
    networks:
      - companion-net
    env_file: .env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:4001
      - PET_SERVICE_URL=http://pet-service:4002
      - CLINIC_SERVICE_URL=http://clinic-service:4003
      - NOTIFICATION_SERVICE_URL=http://notification-service:4004
      - VACCINATION_SERVICE_URL=http://vaccination-service:4005
      - ADMIN_SERVICE_URL=http://admin-service:4006
      - AI_SERVICE_URL=http://ai-service:8001
      - AGENT_SERVICE_URL=http://agent-service:8002
    depends_on:
      - auth-service
      - pet-service
      - clinic-service
      - notification-service
      - vaccination-service
      - admin-service
      - ai-service
      - agent-service

  # ── Auth Service ───────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: ./backend/services/nodejs/auth-service/Dockerfile
    ports:
      - "4001:4001"
    networks:
      - companion-net
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://root:rootpassword@mongodb:27017/companion_ai?authSource=admin
    depends_on:
      - mongodb

  # ── Pet Service ────────────────────────────
  pet-service:
    build:
      context: .
      dockerfile: ./backend/services/nodejs/pet-service/Dockerfile
    ports:
      - "4002:4002"
    networks:
      - companion-net
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://root:rootpassword@mongodb:27017/companion_ai?authSource=admin
    depends_on:
      - mongodb

  # ── Clinic Service ─────────────────────────
  clinic-service:
    build:
      context: .
      dockerfile: ./backend/services/nodejs/clinic-service/Dockerfile
    ports:
      - "4003:4003"
    networks:
      - companion-net
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://root:rootpassword@mongodb:27017/companion_ai?authSource=admin
    depends_on:
      - mongodb

  # ── Notification Service ───────────────────
  notification-service:
    build:
      context: .
      dockerfile: ./backend/services/nodejs/notification-service/Dockerfile
    ports:
      - "4004:4004"
    networks:
      - companion-net
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://root:rootpassword@mongodb:27017/companion_ai?authSource=admin
    depends_on:
      - mongodb

  # ── Vaccination Service ────────────────────
  vaccination-service:
    build:
      context: .
      dockerfile: ./backend/services/nodejs/vaccination-service/Dockerfile
    ports:
      - "4005:4005"
    networks:
      - companion-net
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://root:rootpassword@mongodb:27017/companion_ai?authSource=admin
    depends_on:
      - mongodb

  # ── Admin Service (approvals, tickets, audit)
  admin-service:
    build:
      context: .
      dockerfile: ./backend/services/nodejs/admin-service/Dockerfile
    ports:
      - "4006:4006"
    networks:
      - companion-net
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://root:rootpassword@mongodb:27017/companion_ai?authSource=admin
    depends_on:
      - mongodb

  # ── AI Service (Python FastAPI) ────────────
  ai-service:
    build:
      context: ./backend/services/python/ai-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    networks:
      - companion-net
    env_file: .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - MONGODB_URI=mongodb://root:rootpassword@mongodb:27017/companion_ai?authSource=admin
    volumes:
      - ./ontology/neo4j:/app/ontology:ro
    depends_on:
      mongodb:
        condition: service_started
      neo4j:
        condition: service_healthy

  # ── Agent Service (Python / LangGraph) ─────
  agent-service:
    build:
      context: ./backend/services/python/agent-service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    networks:
      - companion-net
    env_file: .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - MONGODB_URI=mongodb://root:rootpassword@mongodb:27017/companion_ai?authSource=admin
      - PET_SERVICE_URL=http://pet-service:4002
      - CLINIC_SERVICE_URL=http://clinic-service:4003
      - VACCINATION_SERVICE_URL=http://vaccination-service:4005
      - NOTIFICATION_SERVICE_URL=http://notification-service:4004
      - AUTH_SERVICE_URL=http://auth-service:4001
      - AI_SERVICE_URL=http://ai-service:8001
    depends_on:
      mongodb:
        condition: service_started
      neo4j:
        condition: service_healthy

  # ── Neo4j (Ontology) ───────────────────────
  neo4j:
    image: neo4j:5.18-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-your-neo4j-password}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - neo4j_data:/data
      - ./ontology/neo4j/seed:/var/lib/neo4j/import
    networks:
      - companion-net
    # Bolt comes up ~70s after the container starts (the graph-data-science plugin is
    # slow to load). ai-service applies the ontology once, at startup — without this
    # gate it races ahead, fails to connect, and the graph stays silently empty.
    # cypher-shell defaults to bolt://localhost:7687, so this probes Bolt + auth,
    # not just the HTTP port.
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-your-neo4j-password} 'RETURN 1' > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # ── MongoDB (local dev mirror) ─────────────
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: companion_ai
    volumes:
      - mongo_data:/data/db
    networks:
      - companion-net
